version: '3.8'

services:
  neo4j:
    image: neo4j:latest
    container_name: synaptic_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/import:/import
      - ./neo4j/plugins:/plugins
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      # Mandatory plugins for agentic memory
      - NEO4J_PLUGINS='[\"apoc\", \"graph-data-science\"]'
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
    restart: unless-stopped