# version: '3.8'

services:
  neo4j:
    image: neo4j:latest
    container_name: synaptic_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/import:/import
      - ./neo4j/plugins:/plugins
    environment:
      - NEO4J_AUTH=neo4j/your_secure_password
      # Mandatory plugins for agentic memory
      - NEO4J_PLUGINS=["apoc","graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
    networks:
      - synaptic-net
    restart: unless-stopped
  
  # -------------------- KAFKA (KRaft Mode) --------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: synaptic-kafka
    hostname: kafka

    ports:
      - "9092:9092"

    environment:
      # -------- KRaft Core --------
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_NODE_ID=1
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093

      # -------- Listeners --------
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER

      # -------- Internal topics (required) --------
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1

      # -------- KRaft cluster ID (REQUIRED) --------
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - synaptic-net


  # -------------------- KAFKA UI --------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: synaptic-kafka-ui
    ports:
      - "8081:8080"

    environment:
      - KAFKA_CLUSTERS_0_NAME=synaptic-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092

    depends_on:
      - kafka

    networks:
      - synaptic-net


# -------------------- NETWORK --------------------
networks:
  synaptic-net:
    driver: bridge


# -------------------- VOLUMES --------------------
volumes:
  kafka_data:
    driver: local